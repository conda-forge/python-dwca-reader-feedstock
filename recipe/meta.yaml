{% set name = "python-dwca-reader" %}
{% set version = "0.17.1" %}
{% set hash_val = "12a284ae578dd0855046b04a98b61294ee820bc24e00cecf862c75fca224548c" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: {{ hash_val }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - dwca
    - dwca.darwincore
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/BelgianBiodiversityPlatform/python-dwca-reader
  doc_url: https://python-dwca-reader.readthedocs.io
  dev_url: https://github.com/BelgianBiodiversityPlatform/python-dwca-reader
  summary: A simple Python package to read Darwin Core Archive (DwC-A) files.
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - jwcook
